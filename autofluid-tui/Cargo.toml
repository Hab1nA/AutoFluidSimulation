[package]
name = "autofluid-tui"
version = "2.4.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
arboard = { version = "3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Foundation"] }
