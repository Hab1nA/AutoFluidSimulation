[package]
name = "autofluid-tui"
version = "2.5.1"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_Threading"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
